<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="940" height="760" rx="12" fill="#0d1117"/>
<text x="36" y="46" fill="#e6edf3" font-size="24" font-weight="700">Default vs quality profile</text>
<text x="36" y="72" fill="#8b949e" font-size="14">Defaults are speed-biased on purpose; each quality knob is opt-in and buys something measured. Bars scale per section.</text>

<text x="36" y="112" fill="#e6edf3" font-size="16" font-weight="700">Reranked recall &#8212; rerank.auto = "warm"</text>
<text x="904" y="112" fill="#3fb950" font-size="15" font-weight="800" text-anchor="end">buys +0.03 nDCG@10, first hit at rank 1</text>
<text x="178" y="139" fill="#8b949e" font-size="13" text-anchor="end">default (off)</text>
<rect x="190" y="126" width="96" height="16" rx="4" fill="#6e7681"/>
<text x="296" y="139" fill="#8b949e" font-size="12.5" font-weight="600">31 ms p95</text>
<text x="178" y="163" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">quality (GPU)</text>
<rect x="190" y="150" width="560" height="16" rx="4" fill="#3fb950"/>
<text x="760" y="163" fill="#e6edf3" font-size="12.5" font-weight="600">~180 ms p95 &#183; CPU ~1.3 s</text>
<text x="190" y="186" fill="#8b949e" font-size="12">per warm recall, eval harness numbers &#8212; 837 dual-judged labels over Mimir&#8217;s own repo; keep candidates = 15 (25 measured worse)</text>

<text x="36" y="228" fill="#e6edf3" font-size="16" font-weight="700">Auto-recall at every prompt &#8212; opt-in hook</text>
<text x="904" y="228" fill="#3fb950" font-size="15" font-weight="800" text-anchor="end">buys the right memory injected mid-task</text>
<text x="178" y="255" fill="#8b949e" font-size="13" text-anchor="end">default (off)</text>
<rect x="190" y="242" width="2" height="16" rx="1" fill="#6e7681"/>
<text x="202" y="255" fill="#8b949e" font-size="12.5" font-weight="600">no injection</text>
<text x="178" y="279" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">quality</text>
<rect x="190" y="266" width="470" height="16" rx="4" fill="#3fb950"/>
<text x="670" y="279" fill="#e6edf3" font-size="12.5" font-weight="600">40 ms/prompt &#183; ~71 tok when it fires</text>
<text x="190" y="302" fill="#8b949e" font-size="12">warm daemon, live 102k-node store; silence-first &#8212; it injected on 15 of 20 realistic prompts, nothing on the rest</text>

<text x="36" y="344" fill="#e6edf3" font-size="16" font-weight="700">Cold semantic injection &#8212; hooks.cold_mode = "full"</text>
<text x="904" y="344" fill="#3fb950" font-size="15" font-weight="800" text-anchor="end">buys semantic matches with no daemon running</text>
<text x="178" y="371" fill="#8b949e" font-size="13" text-anchor="end">default (fast)</text>
<rect x="190" y="358" width="14" height="16" rx="4" fill="#6e7681"/>
<text x="214" y="371" fill="#8b949e" font-size="12.5" font-weight="600">~6 ms &#8212; BM25 + identifiers only</text>
<text x="178" y="395" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">quality (full)</text>
<rect x="190" y="382" width="560" height="16" rx="4" fill="#3fb950"/>
<text x="760" y="395" fill="#e6edf3" font-size="12.5" font-weight="600">~235 ms</text>
<text x="190" y="418" fill="#8b949e" font-size="12">cold CLI path only (no warm daemon reachable) &#8212; measured on a small store; with the daemon running this knob never applies</text>

<text x="36" y="460" fill="#e6edf3" font-size="16" font-weight="700">Session brief &#8212; [brief] enabled = true</text>
<text x="904" y="460" fill="#3fb950" font-size="15" font-weight="800" text-anchor="end">buys your gotchas re-surfaced at session start</text>
<text x="178" y="487" fill="#8b949e" font-size="13" text-anchor="end">default (off)</text>
<rect x="190" y="474" width="2" height="16" rx="1" fill="#6e7681"/>
<text x="202" y="487" fill="#8b949e" font-size="12.5" font-weight="600">0 tokens</text>
<text x="178" y="511" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">quality</text>
<rect x="190" y="498" width="560" height="16" rx="4" fill="#3fb950"/>
<text x="760" y="511" fill="#e6edf3" font-size="12.5" font-weight="600">&#8804;450 tok/session worst case</text>
<text x="190" y="534" fill="#8b949e" font-size="12">150-token cap at startup + 100-token recaps after clear/compact, max 4 fires; irrelevant cross-project memories are gated out</text>

<text x="36" y="576" fill="#e6edf3" font-size="16" font-weight="700">Free quality (already on by default)</text>
<text x="36" y="602" fill="#8b949e" font-size="13">&#8226; shared inference daemon: agent sessions hold <tspan fill="#3fb950" font-weight="700">0 GPU memory</tspan> (was 0.7&#8211;6 GiB each, growing) &#8212; one daemon owns the models</text>
<text x="36" y="624" fill="#8b949e" font-size="13">&#8226; warm in-process recall <tspan fill="#3fb950" font-weight="700">6.4 ms</tspan> at 99k nodes &#183; type-aware ranking, recency and strength decay &#8212; no knobs needed</text>

<text x="36" y="676" fill="#e6edf3" font-size="13" font-weight="700">Honesty footer</text>
<text x="36" y="696" fill="#8b949e" font-size="12.5">Every number here was measured on one machine and one real store &#8212; mine (102k nodes grown from daily use). Quality deltas come from a</text>
<text x="36" y="714" fill="#8b949e" font-size="12.5">graded eval over Mimir&#8217;s own repo. Your corpus, hardware and habits will shift them; the knobs exist so you can re-decide per box.</text>
<text x="36" y="736" fill="#8b949e" font-size="12.5">Full decision tables with the same numbers: README &#8220;[rerank] auto&#8221; section and docs/benchmarks.md. Measured 2026-07.</text>
</svg>
