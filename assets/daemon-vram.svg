<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="940" height="360" rx="12" fill="#0d1117"/>
<text x="36" y="46" fill="#e6edf3" font-size="24" font-weight="700">GPU memory: before and after the shared inference daemon</text>
<text x="36" y="72" fill="#8b949e" font-size="14">v0.15 default on GPU builds &#8212; sessions delegate embedding + reranking to one daemon and hold no GPU state at all</text>

<text x="36" y="116" fill="#e6edf3" font-size="15" font-weight="700">before (v0.14)</text>
<text x="240" y="143" fill="#8b949e" font-size="13" text-anchor="end">5 agent sessions</text>
<rect x="252" y="130" width="560" height="16" rx="4" fill="#6e7681"/>
<text x="822" y="143" fill="#8b949e" font-size="12.5" font-weight="600">~11.4 GiB</text>
<text x="252" y="166" fill="#8b949e" font-size="12">1.3&#8211;6.0 GiB each, and growing with every recall &#8212; the runtime&#8217;s inference pools are never freed</text>

<text x="36" y="210" fill="#e6edf3" font-size="15" font-weight="700">after (v0.15)</text>
<text x="240" y="237" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">any number of sessions</text>
<rect x="252" y="224" width="2" height="16" rx="1" fill="#3fb950"/>
<text x="264" y="237" fill="#e6edf3" font-size="12.5" font-weight="600">0</text>
<text x="240" y="261" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">one daemon</text>
<rect x="252" y="248" width="118" height="16" rx="4" fill="#3fb950"/>
<text x="380" y="261" fill="#e6edf3" font-size="12.5" font-weight="600">0.3&#8211;2.4 GiB, recycled daily</text>
<text x="252" y="284" fill="#8b949e" font-size="12">the daemon is the only GPU process; sessions fall back to CPU-local inference if it&#8217;s down and resume on their own</text>

<text x="36" y="326" fill="#8b949e" font-size="12.5">Measured live on my machine (drm-memory-vram per process), 2026-07. A/B on the same store: 8 varied recalls grew an old-binary session</text>
<text x="36" y="344" fill="#8b949e" font-size="12.5">by +125 MiB retained; the new binary&#8217;s session stayed at 0. Your GPU stack may behave differently &#8212; the daemon is optional either way.</text>
</svg>
