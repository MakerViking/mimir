[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.14.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MakerViking/mimir"
authors = ["Thomas H"]

[workspace.dependencies]
# Path deps carry versions so the workspace is publishable as-is.
# Published names: mimir-mem (bin mimir), mimir-mem-core, mimir-graph, mimir-syntax.
# mimir-syntax holds language-adapter/tree-sitter extraction with no dependency
# on mimir-core, so mimir-core can use it (for code-chunk indexing) without a
# cycle back through mimir-graph (which itself depends on mimir-core).
mimir-core = { path = "crates/mimir-core", package = "mimir-mem-core", version = "0.14.0" }
mimir-syntax = { path = "crates/mimir-syntax", version = "0.14.0" }
mimir-graph = { path = "crates/mimir-graph", version = "0.14.0" }
mimir-proxy = { path = "crates/mimir-proxy", package = "mimir-mem-proxy", version = "0.14.0" }

rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
ulid = "1.2"
blake3 = "1.8"
ignore = "0.4"
pulldown-cmark = "0.13"
fastembed = "5"
# Same ort fastembed pins; lets us enable GPU execution-provider features
# and construct EPs with matching types.
ort = { version = "=2.0.0-rc.12", default-features = false }
# For downloading models fastembed's own registry doesn't cover (e.g. granite,
# wave-2 item #8) via fastembed's user-defined-model path. Same version and
# blocking client (ureq+native-tls) fastembed's own "hf-hub-native-tls"
# default feature already pulls in, so this adds no new transitive deps —
# just a direct handle on the client for repos outside fastembed's registry.
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
rayon = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
petgraph = "0.8"
rmcp = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "http2", "rustls", "webpki-roots"] }
futures-util = "0.3"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-sequel-tsql = "0.4"
tree-sitter-cpp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-php = "0.24"
indicatif = "0.18"
tiktoken-rs = "0.12"
once_cell = "1"

[profile.release]
lto = "thin"
strip = true
