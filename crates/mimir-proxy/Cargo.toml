[package]
name = "mimir-mem-proxy"
description = "Optional local API proxy for Mimir: prompt-cache optimization + token-savings measurement"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["mimir", "proxy", "anthropic", "tokens", "cache"]
categories = ["command-line-utilities"]

[lib]
name = "mimir_proxy"

[dependencies]
mimir-core.workspace = true
anyhow.workspace = true
axum.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
# raw_value: `patch` copies the parts of a request it does not change as text.
serde_json = { workspace = true, features = ["raw_value"] }
tracing.workspace = true
rusqlite.workspace = true
