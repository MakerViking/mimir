[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MakerViking/mimir"
authors = ["Thomas H"]

[workspace.dependencies]
# Path deps carry versions so the workspace is publishable as-is.
# Published names: mimir-mem (bin mimir), mimir-mem-core, mimir-graph.
mimir-core = { path = "crates/mimir-core", package = "mimir-mem-core", version = "0.4.0" }
mimir-graph = { path = "crates/mimir-graph", version = "0.4.0" }

rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
ulid = "1.2"
blake3 = "1.8"
ignore = "0.4"
pulldown-cmark = "0.13"
fastembed = "5"
# Same ort fastembed pins; lets us enable GPU execution-provider features
# and construct EPs with matching types.
ort = { version = "=2.0.0-rc.12", default-features = false }
rayon = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
petgraph = "0.8"
rmcp = { version = "1.7", features = ["server", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
indicatif = "0.18"

[profile.release]
lto = "thin"
strip = true
