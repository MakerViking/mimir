[package]
name = "mimir-mem-core"
description = "Engine for Mimir: unified local-first memory for AI coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["memory", "mcp", "agent", "search", "sqlite"]
categories = ["command-line-utilities", "database"]

# Keep the import path `mimir_core::` despite the published package name.
[lib]
name = "mimir_core"

[features]
# GPU acceleration for embedding/reranking (optional; CPU-only by default).
# The two are mutually exclusive: each selects a different prebuilt
# onnxruntime binary, and no binary ships with both.
# - gpu-webgpu: cross-vendor via Dawn — Vulkan (Linux), D3D12 (Windows),
#   Metal (macOS). The right choice for AMD/Intel GPUs.
# - gpu-cuda: NVIDIA via CUDA 12/13.
gpu-webgpu = ["ort/webgpu"]
gpu-cuda = ["ort/cuda"]
# Real-model retrieval-eval baseline (crates/mimir-core/src/eval): embeds
# the eval fixtures with the actual default model instead of synthetic
# vectors. Dev-only; never enabled by default.
eval = []

[dependencies]
mimir-syntax.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
ulid.workspace = true
blake3.workspace = true
fastembed.workspace = true
hf-hub.workspace = true
ignore.workspace = true
ort.workspace = true
rayon.workspace = true
pulldown-cmark.workspace = true
thiserror.workspace = true
tracing.workspace = true
tiktoken-rs.workspace = true
once_cell.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile = "3"
