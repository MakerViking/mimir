[package]
name = "mimir-core"
description = "Engine for Mimir: unified local-first memory for AI coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# GPU acceleration for embedding/reranking (optional; CPU-only by default).
# The two are mutually exclusive: each selects a different prebuilt
# onnxruntime binary, and no binary ships with both.
# - gpu-webgpu: cross-vendor via Dawn — Vulkan (Linux), D3D12 (Windows),
#   Metal (macOS). The right choice for AMD/Intel GPUs.
# - gpu-cuda: NVIDIA via CUDA 12/13.
gpu-webgpu = ["ort/webgpu"]
gpu-cuda = ["ort/cuda"]

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
ulid.workspace = true
blake3.workspace = true
fastembed.workspace = true
ignore.workspace = true
ort.workspace = true
rayon.workspace = true
pulldown-cmark.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
