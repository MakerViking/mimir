[package]
name = "mimir-cli"
description = "Mimir: unified local-first memory for AI coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mimir"
path = "src/main.rs"

[features]
# GPU acceleration (see mimir-core; pick at most one):
#   cargo install --features gpu-webgpu   # Vulkan/D3D12/Metal via Dawn
#   cargo install --features gpu-cuda     # NVIDIA CUDA
gpu-webgpu = ["mimir-core/gpu-webgpu"]
gpu-cuda = ["mimir-core/gpu-cuda"]

[dependencies]
mimir-core.workspace = true
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
libc = "0.2"
rmcp.workspace = true
schemars.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
